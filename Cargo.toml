[workspace]
resolver = "2"
members = [
    "crates/hearth-lib",
    "crates/hearth-cli",
    "crates/hearth-daemon",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Naoray/hearth"
description = "Unified Laravel development command center"

[workspace.dependencies]
# Shared across crates
hearth-lib = { path = "crates/hearth-lib" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

# Process supervision
command-group = "5"
nix = { version = "0.29", features = ["signal", "process"] }
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Network / IPC
reqwest = { version = "0.12", features = ["json", "stream"] }

# Certificates
rcgen = "0.13"

# macOS Keychain
security-framework = "3"

# PHP config
configparser = "3"

# Filesystem
dirs = "6"

# MCP (Phase 2)
rmcp = { version = "1", features = ["server", "transport-streamable-http-server"] }
schemars = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Archive extraction (for GitHub Release downloads)
flate2 = "1"
tar = "0.4"
zip = "2"
