name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/hearth dist/
          cp target/${{ matrix.target }}/release/hearth-daemon dist/
          tar -czf hearth-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist hearth hearth-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hearth-${{ matrix.target }}
          path: hearth-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: hearth-*.tar.gz
          generate_release_notes: true

  bump-homebrew-tap:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Validate Homebrew tap token
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error title=Missing HOMEBREW_TAP_TOKEN::Configure the repository Actions secret HOMEBREW_TAP_TOKEN with Contents and Pull requests write access to Naoray/homebrew-tap."
            exit 1
          fi

      - name: Open Homebrew tap bump PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: .agents/tap-bump/bump-to-tag.sh "${GITHUB_REF_NAME}"
